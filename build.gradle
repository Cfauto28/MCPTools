plugins {
    id 'java'
    id "com.gradleup.shadow" version "9.6.1"
}

group = 'net.cfauto'
version = '1.0'

repositories {
    mavenCentral()
    gradlePluginPortal()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net'
    }
}

dependencies {
    shadow(implementation("net.fabricmc:mercury:0.6.0"))
    shadow(implementation('net.sf.jopt-simple:jopt-simple:6.0-alpha-3'))
    shadow(implementation("net.fabricmc:mapping-io:0.9.1"))
//  shadow(implementation("com.cloudbees:diff4j:1.3"))
}

jar {
    manifest {
        attributes 'Main-Class': "net.cfauto.mcptools.Main"
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.named('shadowJar').configure {
    archiveClassifier = 'fatjar'
}
